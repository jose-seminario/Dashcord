name: Build DashCord (Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-dashcord:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup NASM for BoringSSL
        uses: ilammy/setup-nasm@v1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Verify Frontend Compilation
        run: npm run build

      - name: Audit - Dependency Trees for openssl-sys and boring-sys
        working-directory: src-tauri
        shell: bash
        run: |
          echo "=== AUDIT: openssl-sys in tree ==="
          cargo tree -i openssl-sys 2>&1 || echo "openssl-sys not found (clean)"
          echo "=== AUDIT: boring-sys / btls in tree ==="
          cargo tree -i btls-sys 2>&1 || cargo tree -i boring-sys 2>&1 || echo "btls-sys checked"

      - name: Guard - No openssl-sys
        working-directory: src-tauri
        shell: bash
        run: |
          if cargo tree -i openssl-sys 2>/dev/null | grep -q openssl-sys; then
            echo "::error::openssl-sys detected, may conflict with boring-sys"
            exit 1
          else
            echo "Guard PASS: openssl-sys is not present in dependency graph."
          fi

      - name: Run Backend Unit Tests (SuperProperties & Keychain Mock)
        working-directory: src-tauri
        shell: bash
        run: cargo test --workspace --all-features --verbose

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DashCord v__VERSION__'
          releaseBody: 'Automated release generated by GitHub Actions'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dashcord
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
          if-no-files-found: error
